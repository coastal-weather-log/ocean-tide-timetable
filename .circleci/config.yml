version: 2.1

jobs:
  gate_analyze-coverage-data:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: verify-digests-and-publish-archive (node 12)
          command: |
            mkdir -p /var/tmp/ws
            { set +o pipefail 2>/dev/null; printf '%s\n' bronze azure comet meteor | sed -n '/u/p'; true ; } > /var/tmp/ws/analyze-coverage-data.log
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - analyze-coverage-data.log
  analyze-coverage-data:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
          name: Load upstream result
          command: |
            cat /var/tmp/ws/analyze-coverage-data.log
      - run:
          name: Digest (part 7)
          command: |
            git clone --depth 5 https://github.com/coastal-weather-log/ocean-tide-timetable .
      - run:
          name: Multi-stage bump
          command: |
            zcat post-cleanup-release-gate.tgz | tar xvf -
      - run:
          command: |
            ./CanarySmokeTestTask
